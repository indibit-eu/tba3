groupId:
  in: path
  name: id
  required: true
  schema:
    type: string
  description: Id der Lerngruppe
  examples:
    Deutsch Grundschule (mittel):
      value: 3a-deutsch
      description: Lerngruppe 3a (mittel), Fach Deutsch
    Deutsch Grundschule (gut):
      value: 3b-deutsch
      description: Lerngruppe 3b (gut), Fach Deutsch
    Deutsch Grundschule (schlecht):
      value: 3c-deutsch
      description: Lerngruppe 3c (schlecht), Fach Deutsch
    Mathematik Grundschule (mittel):
      value: 3a-mathe
      description: Lerngruppe 3a (mittel), Fach Mathematik
    Mathematik Grundschule (gut):
      value: 3b-mathe
      description: Lerngruppe 3b (gut), Fach Mathematik
    Mathematik Grundschule (schlecht):
      value: 3c-mathe
      description: Lerngruppe 3c (schlecht), Fach Mathematik
    Deutsch (mittel):
      value: 8a-deutsch
      description: Lerngruppe 8a (mittel), Fach Deutsch
    Deutsch (gut):
      value: 8b-deutsch
      description: Lerngruppe 8b (gut), Fach Deutsch
    Deutsch (schlecht):
      value: 8c-deutsch
      description: Lerngruppe 8c (schlecht), Fach Deutsch
    Englisch (mittel):
      value: 8a-englisch
      description: Lerngruppe 8a (mittel), Fach Englisch
    Englisch (gut):
      value: 8b-englisch
      description: Lerngruppe 8b (gut), Fach Englisch
    Englisch (schlecht):
      value: 8c-englisch
      description: Lerngruppe 8c (schlecht), Fach Englisch
    Mathematik (mittel):
      value: 8a-mathe
      description: Lerngruppe 8a (mittel), Fach Mathematik
    Mathematik (gut):
      value: 8b-mathe
      description: Lerngruppe 8b (gut), Fach Mathematik
    Mathematik (schlecht):
      value: 8c-mathe
      description: Lerngruppe 8c (schlecht), Fach Mathematik
type:
  in: query
  name: type
  explode: false
  schema:
    type: string
  description: Wertegruppen, welche ausgegeben werden sollen
  examples:
    Lerngruppe:
      value: ''
      description: Liefert Leistungsdaten auf Gruppenebene (Standard).
    Schüler:
      value: student
      description: Liefert Leistungsdaten auf Schülerebene.
    Lerngruppe und Schüler:
      value: group,student
      description: Liefert Leistungsdaten auf Gruppen- und Schülerebene.
    Land und Schulamtsbezirke:
      value: state,district
      description: Liefert Leistungsdaten für Landes- und Bezirksebene (nur für /state Endpunkte).
aggregation:
  in: query
  name: aggregation
  explode: false
  schema:
    type: string
  description: Aggregationsarten, die berechnet werden sollen
  examples:
    Kompetenzen:
      value: competence
      description: Aggregiert Leistungsdaten nach zugewiesenen Kompetenzen der einzelnen Items.
    Geschlecht:
      value: gender
      description: Aggregiert Leistungsdaten nach Geschlecht der Schüler:innen.
schoolId:
  in: path
  name: id
  required: true
  schema:
    type: string
  description: Id der Schule
  examples:
    Grundschule:
      value: gs-musterstadt
      description: Beispielhafte Grundschule
    Gymnasium:
      value: gym-beispielstadt
      description: Beispielhaftes Gymnasium
stateId:
  in: path
  name: id
  required: true
  schema:
    type: string
  description: Id des Bundeslandes
  examples:
    Beispielland:
      value: beispielland
      description: Beispielhaftes Bundesland
comparison:
  in: query
  name: comparison
  explode: false
  schema:
    type: string
  description: Filter für bestimmte Vergleichsgruppen, die ausgegeben werden sollen.
filter:
  in: query
  name: filter
  explode: false
  schema:
    type: string
  description: Schränkt die Ergebnisse ein, z.B. auf eine Teilgruppe unterhalb der angefragten Ebene oder auf einen Kontext wie Testprojekt, Fach oder Domäne. Syntax `typ-id`, mehrere Werte kommasepariert.
  examples:
    Schüler:in:
      value: student-1234
      description: Nur Ergebnisse für die Schülerin bzw. den Schüler mit der Id 1234 (z.B. auf /groups mit type=student).
    Lerngruppe:
      value: group-3a-deutsch
      description: Nur Ergebnisse für die Lerngruppe 3a-deutsch (z.B. auf /schools mit type=group).
    Schule:
      value: school-gym-beispielstadt
      description: Nur Ergebnisse für die Schule gym-beispielstadt (z.B. auf /states mit type=school).
    Schulamt:
      value: authority-schulamt-nord
      description: Nur Ergebnisse innerhalb des Schulamts schulamt-nord (z.B. auf /states mit type=school).
    Bezirk:
      value: district-bezirk-nord
      description: Nur Ergebnisse innerhalb des Bezirks bezirk-nord (z.B. auf /states mit type=authority).
    Testprojekt:
      value: testproject-v8-2024
      description: Nur Ergebnisse aus dem Testprojekt / Durchgang v8-2024.
    Fach:
      value: subject-de
      description: Nur Ergebnisse für das Fach Deutsch.
    Domäne:
      value: domain-le
      description: Nur Ergebnisse für die Domäne Lesen.
    Kombiniert:
      value: subject-en,domain-le
      description: Verschiedene Präfixe werden kombiniert (hier mit einem UND). Nur Ergebnisse für die Domäne Leseverstehen im Fach Englisch.
