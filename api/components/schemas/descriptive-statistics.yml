type: object
required:
  - descriptiveStatistics
properties:
  descriptiveStatistics:
    type: object
    required:
      - total
      - mean
      - frequency
      - standardDeviation
    properties:
      total:
        type: integer
        description: Gesamtzahl der Items (Bezugsgröße für alle Ausprägungen, auch in `other`)
        examples:
          - 4
      mean:
        type: number
        description: Anteil richtig gelöster Items / Mittlere Lösungsquote
        minimum: 0
        maximum: 1
        examples:
          - 0.75
      frequency:
        type: integer
        description: Absolute Anzahl richtig gelöster Items
        examples:
          - 3
      standardDeviation:
        type: number
        description: Standardabweichung der mittleren Lösungsquote
      other:
        type: array
        description: >-
          Optionale Kennwerte für weitere Ergebnisausprägungen neben "richtig" (z.B. falsch, ausgelassen).
          `frequency` und `mean` der Einträge beziehen sich auf dasselbe `total`.
          Idealerweise ergeben die Felder für "richtig" zusammen mit allen Einträgen in `other` das `total`; es dürfen aber auch nur einzelne Ausprägungen übermittelt werden.
          Fehlt `other`, liegen keine Informationen zu weiteren Ausprägungen vor.
        items:
          $ref: './descriptive-statistics-other.yml'
